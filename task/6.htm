<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>6</title>
    <style>
        header,nav,article,ads,footer{
            background: rgb(101, 181, 101);}

        .container{
            margin: auto;
            min-width: 1000px;
            display: grid;
            gap: 10px;
            grid-template-columns: 20% auto;
            grid-template-rows: 100px 400px 190px 90px;
        }
            header { grid-area: 1 / 1 / span 1 / span 4;}
            nav{ grid-area: 2 / 3 / span 1 / span 1;}
            article{grid-area: 2 / 1 / span 1 / span 2;}
            ads{ grid-area: 2 / 4 / span 1 / span 1;}
            footer { grid-area: 3 / 1 / span 1 / span 4;}
    </style>
</head>
<body>
    <div class="container">
        <header>header</header>
        <nav>nav</nav>
        <article>article</article>
        <ads>ads</ads>
        <footer>footer</footer>
    </div>
</body>
</html>
